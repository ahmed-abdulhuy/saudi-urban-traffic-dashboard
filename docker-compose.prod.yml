services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: Riyadh-Traffic-Tracker-Backend

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod

    container_name: Riyadh-Traffic-Tracker-Frontend

    restart: unless-stopped

    env_file:
    - .env
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api


    expose:
      - "3000"

  nginx:
    image: nginx:mainline-alpine

    container_name: Riyadh-Traffic-Tracker-Nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - backend